<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file: 'unsafe-eval'; style-src 'self' file: 'unsafe-inline'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>PianoScope</title><link rel="stylesheet" href="style.css"></head><body>
<div id="shell">
<button id="sidebarBackdrop" tabindex="-1" aria-label="关闭侧栏"></button>
<aside id="sidebar" aria-label="曲目与设置">
  <div class="sidebar-header"><div class="brand"><span class="brand-icon">▥</span><b>Piano<span>Scope</span></b></div><button id="sidebarClose" aria-label="收起侧栏" title="收起侧栏">×</button></div>
  <div class="library-actions"><button id="openFolder" class="gold-outline" aria-label="选择 MIDI 文件夹">选择文件夹</button><button id="open">打开单曲</button></div>
  <div class="sidebar-content">
    <section class="sidebar-section"><h2>示例曲目</h2><button data-demo="demo:first-light" class="demo active"><span>初光</span><small>01</small></button><button data-demo="demo:harmonics" class="demo"><span>泛音练习</span><small>02</small></button></section><section class="sidebar-section"><h2 id="libraryTitle">我的曲目</h2><input id="songSearch" type="search" placeholder="搜索曲目" aria-label="搜索文件夹曲目" hidden><p id="libraryHint" class="hint">选择文件夹后，在这里切换曲目。</p><div id="librarySongs"></div><div id="external"></div></section>
    <section class="sidebar-section score-entries"><h2>练习谱</h2><button id="scoreSettings" class="wide">制谱设置</button><button id="exportPDF" class="wide">导出 PDF</button><button id="exportXML" class="wide">导出 MusicXML</button></section>
    <section class="sidebar-section hand-section"><h2>左右手</h2><div class="legend"><span class="left">● 左手 <small>L</small></span><span class="right">● 右手 <small>R</small></span><span class="unassigned">● 未分配 <small>—</small></span></div><div id="handMode" class="hand-modes"><button data-hand="both" class="chosen">双手</button><button data-hand="left">只听左手</button><button data-hand="right">只听右手</button></div><button id="settings" class="wide">左右手设置 <span>↗</span></button><button id="tracks" class="wide track-entry">轨道设置 <span>↗</span></button><div id="unassignedHint" class="hint" hidden><span>部分音符尚未分配左右手。</span><button id="dismissHint" aria-label="关闭提示">×</button></div></section>
  </div>
  <div class="sidebar-foot">A0 — C8 <span>88 键</span></div>
</aside>
<main><section class="music"><div class="music-head"><button id="sidebarToggle" aria-label="展开侧栏" aria-controls="sidebar" aria-expanded="true" title="曲目与设置">☰</button><div class="piece-heading"><div class="piece-title"><h1 id="title">PianoScope</h1><span class="eyebrow" id="range">—</span></div><p id="meta">看见音乐，认识琴键</p></div><div class="view-options"><div class="segmented"><button id="full">完整键盘</button><button id="focused" class="chosen">曲目键盘</button></div><label><input id="names" type="checkbox" checked> 显示音名</label><label class="roll-only"><input id="motion" type="checkbox"> 静态音符</label><label class="strike-control">触键线上移 <input id="strikePosition" type="range" min="0" max="60" step="1" value="0" aria-label="触键线上移，音符区高度百分比"><output id="strikePositionText" for="strikePosition">0%</output></label></div></div>
<div class="notation-nav"><div class="segmented"><button id="viewRoll" class="chosen">下落音符</button><button id="viewScore">五线谱</button></div><div id="scoreControls" hidden><label><input id="autoFollow" type="checkbox" checked> 自动跟随</label><button id="backToScore">回到当前</button><label>缩放 <select id="scoreZoom" aria-label="谱面缩放"><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option></select></label><button id="keyboardToggle">收起键盘</button><span id="scorePosition"></span></div></div>
<div id="scoreStatus" role="status" hidden><span id="scoreStatusText"></span><button id="cancelScoreJob" hidden>取消</button></div>
<div id="previewActions" hidden><span id="previewSummary"></span><button id="applyNotation" class="primary">应用谱面</button><button id="discardNotation">取消</button><button id="reviewNotation">制谱设置</button></div>
<div id="message" role="status" hidden></div><div id="deviceError" class="error" hidden><b>未找到声音输出设备</b><span>连接耳机或扬声器后重试</span><button id="retry">重试</button><button id="other">打开其他文件</button></div>
<div id="loading" hidden><span id="loadLabel">正在读取曲目</span><progress id="progress" max="1" value="0"></progress><span id="percent"></span><button id="cancel">取消</button></div>
<div id="scene"><div id="rollViewport"><canvas id="roll" aria-label="下落音符，暂停后可选择音符" tabindex="0"></canvas></div><div id="scoreViewport" tabindex="0" aria-label="五线谱，可滚动浏览或点击跳转" hidden><div id="scoreEmpty"><p>生成钢琴练习谱</p><button id="scoreStart" class="primary">制谱设置</button></div><div id="scorePages"></div></div><div id="keys" aria-label="钢琴键盘"></div><div id="central"></div></div>
<div class="current-row"><span id="currentLabel">当前音符</span><div id="current" aria-live="off"></div><span id="pedalLegend">■ 按住　□ 延音</span><span id="syncStatus" role="status"></span><span id="picked"></span></div></section>
<section class="transport-panel"><div class="wave-head"><span>整曲声音概览</span><span id="clock">00:00 / 00:00</span></div><canvas id="overview" tabindex="0" aria-label="整曲声音概览与进度跳转"></canvas><div class="time-labels"><span>00:00</span><span id="endtime">00:00</span></div><div class="controls"><div class="play-controls"><button id="play" class="primary icon" aria-label="播放" title="播放">▶</button><button id="stop" class="icon" aria-label="停止" title="停止">■</button></div><div class="segmented speeds"><button data-rate="0.5">慢速 0.5×</button><button data-rate="0.75">0.75×</button><button data-rate="1" class="chosen">正常 1×</button></div><button id="loop" aria-pressed="false">↻ 片段循环</button><button id="analysisToggle">▥ 查看频谱</button><label class="volume">音量 <input id="volume" type="range" min="0" max="100" value="65" aria-label="音量"><span id="volumeText">65%</span></label></div><div id="loopInputs" hidden><label>起点 <input id="loopA" type="number" min="0" step="0.1" value="0"> s</label><label>终点 <input id="loopB" type="number" min="0" step="0.1" value="0"> s</label><button id="applyLoop">应用</button></div></section>
<section id="analysis" hidden><div><span>声音波形</span><canvas id="wave" aria-label="实际输出声音波形"></canvas></div><div><span>声音频谱</span><canvas id="spectrum" aria-label="实际输出声音频谱"></canvas><div class="freq-labels"><span>20 Hz</span><span>200 Hz</span><span>2 kHz</span><span>20 kHz</span></div></div></section>
</main></div>
<div id="editor" class="overlay" hidden><section class="editor-card" role="dialog" aria-modal="true" aria-labelledby="editorTitle"><div class="editor-head"><h2 id="editorTitle">左右手设置</h2><button id="closeEditor" aria-label="关闭左右手设置">×</button></div><div class="hand-only assignment-choice"><label>分配方式 <select id="rule" aria-label="分配方式"><option value="tracks">按轨道分配</option><option value="pitch_split">按音高初分</option></select></label><p id="assignmentHelp" class="hint"></p><label id="splitField" hidden>分界音 <select id="split" aria-label="分界音"></select></label><p id="splitSummary" class="hint" hidden></p></div><p id="previewHint" class="hint hand-only" role="status" hidden></p><div id="trackSettings"></div><div class="editor-tools track-only"><button id="applyTracks">应用轨道设置</button></div><div class="selection-tools hand-only"><span id="selectionCount">0 个音符</span><button data-assign="left">指派左手</button><button data-assign="right">指派右手</button><button data-assign="unassigned">清除分配</button></div><p id="warnings"></p><div class="editor-foot hand-only"><button id="editNotes">选择音符微调 ↗</button><button id="undo">撤销上次分配</button><button id="preview">预览分配</button><button id="applyHands" class="primary" disabled>应用分配</button></div></section></div>
<div id="selectionBar" hidden><span id="selectedLabel"></span><button data-assign="left">指派左手</button><button data-assign="right">指派右手</button><button data-assign="unassigned">清除分配</button><button id="selectionClear">×</button></div>
<div id="pathFallback" class="overlay" hidden><section class="editor-card"><h2>打开 MIDI</h2><label>文件路径 <input id="filePath" type="text"></label><button id="loadPath">打开 MIDI</button><button id="closePath">取消</button></section></div>
<div id="notationSettings" class="overlay" hidden><section class="editor-card notation-modal" role="dialog" aria-modal="true" aria-labelledby="notationTitle"><div class="editor-head"><h2 id="notationTitle">制谱设置</h2><button id="closeNotation" aria-label="关闭制谱设置">×</button></div><div class="notation-scroll"><p id="notationError" role="status"></p><div id="notationIssues"></div><div class="notation-options"><label>谱表分配 <select id="staffMode"><option value="hands">按已确认手别建议</option><option value="pitch">按音高初分</option><option value="tracks">按轨道分配</option></select></label><label id="staffSplitField">分界音 <input id="staffSplit" type="number" min="21" max="108" value="60"></label><label>节奏量化 <select id="rhythm"><option value="auto">自动整理（推荐）</option><option value="straight">严格：常规节奏（最细十六分）</option><option value="triplets">严格：含八分三连音</option></select></label><label>谱号 <select id="clefMode"><option value="auto_octaves">自动（含八度标记）</option><option value="auto">自动高低音谱号</option><option value="standard">固定高音／低音谱号</option></select></label><label>拍号来源 <select id="notationMeter"><option value="source">使用原曲拍号</option><option>2/4</option><option>3/4</option><option>4/4</option><option>6/8</option></select></label><label>调号来源 <select id="notationKey"><option value="source">使用原曲调号</option><option value="auto">自动建议调号</option><option value="C">无升降调号＋临时记号</option><option>G</option><option>D</option><option>A</option><option>E</option><option>B</option><option>F#</option><option>C#</option><option>F</option><option>Bb</option><option>Eb</option><option>Ab</option><option>Db</option><option>Gb</option><option>Cb</option><option>Am</option><option>Em</option><option>Bm</option><option>F#m</option><option>C#m</option><option>G#m</option><option>D#m</option><option>A#m</option><option>Dm</option><option>Gm</option><option>Cm</option><option>Fm</option><option>Bbm</option><option>Ebm</option><option>Abm</option></select></label><label>弱起长度（拍）<input id="pickup" type="text" value="0" aria-label="弱起长度，四分音符拍数，如 0、1、1/2"></label></div><p id="notationSources" class="hint"></p><p id="keySuggestion" class="hint" hidden></p><label><input id="confirmDefaults" type="checkbox"> 确认缺失元数据的默认值</label><h3>制谱轨道</h3><div id="notationTracks"></div><p id="notationAssignment" class="hint"></p><div id="notationWarnings"></div></div><div class="editor-tools"><button id="generateNotation" class="primary">生成预览</button><button id="dismissNotation">取消</button></div></section></div>
<div id="exportCheck" class="overlay" hidden><section class="editor-card" role="dialog" aria-modal="true" aria-labelledby="exportTitle"><div class="editor-head"><h2 id="exportTitle">导出 PDF</h2><button id="closeExport" aria-label="关闭导出检查">×</button></div><p id="exportSummary"></p><button id="saveNotation" class="primary">导出 PDF</button><button id="dismissExport">取消</button></section></div>
<script src="keyboard.js"></script><script src="app.js"></script><script src="score.js"></script></body></html>
