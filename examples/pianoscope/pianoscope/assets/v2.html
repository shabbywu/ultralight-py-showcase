<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self'; img-src 'self' file: data:; connect-src 'none'"><title>PianoScope</title><link rel="stylesheet" href="v2.css"></head><body>
<button id="shade" aria-label="关闭侧栏" hidden></button><aside id="sidebar"><div class="brand"><b>♫ PianoScope</b><button id="closeSidebar" aria-label="关闭侧栏">×</button></div><p class="muted">看见音乐，认识琴键</p><button id="open">打开乐谱</button><button id="folder">选择文件夹</button><div class="caption">原创练习</div><button data-demo="demo:first-light">初光 · 乐谱阅读练习</button><button data-demo="demo:harmonics">回环与晨光</button><div id="folderName" class="caption">当前文件夹</div><input id="search" placeholder="搜索曲目" aria-label="搜索曲目"><div id="library"></div><div class="caption">练习与导出</div><button id="audition">试听与手别</button><button id="export">导出…</button><button id="diagnostics">乐谱提示</button><small class="muted">MusicXML 乐谱 · 离线钢琴合成播放</small></aside>
<main><div class="top"><button id="menu" aria-label="打开侧栏">☰</button><div class="song"><b id="title">打开一份乐谱</b><small id="meta">MusicXML／MXL 钢琴双谱表</small></div><div class="views"><button id="sheetMode" class="chosen">五线谱</button><button id="rollMode">下落音符</button></div></div>
<div class="tools"><button id="follow" aria-pressed="true">自动跟随</button><button id="current">回到当前</button><select id="zoom" aria-label="谱面缩放"><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option></select><button id="keyboardToggle">显示键盘</button><button id="analysisToggle">查看频谱</button><span id="visitText" class="muted"></span><select id="occurrence" aria-label="选择跳转遍次" hidden></select></div>
<div id="message" role="status" hidden></div><div id="loading" hidden><span id="loadLabel"></span><button id="cancelLoad">取消</button></div>
<section id="workspace"><div id="sheet" tabindex="0" aria-label="五线谱"><div id="empty">打开乐谱后即可阅读、试听和慢练。<br><button id="emptyOpen">打开乐谱</button></div></div><div id="rollArea" hidden><canvas id="roll"></canvas><div id="strike"><span id="strikeLabel">现在 · 按下</span></div></div></section>
<div id="keyboard" hidden><div class="keytools"><button id="full">完整 88 键</button><button id="focused" class="chosen">曲目键盘</button><label><input id="names" type="checkbox" checked>音名</label><label>触键线上移 <input id="lift" type="range" min="0" max="60" value="0"><span id="liftText">0%</span></label><span id="picked" class="muted">中央 C · C4</span></div><div id="keys"></div></div>
<div id="analysis" hidden><canvas id="wave"></canvas><canvas id="spectrum"></canvas></div><canvas id="overview"></canvas>
<div class="transport"><button id="play" aria-label="播放">▶</button><button id="stop" aria-label="停止">■</button><span id="position">00:00</span><input id="seek" type="range" min="0" max="1" step=".001" value="0" aria-label="播放位置"><span id="duration">00:00</span><select id="rate" aria-label="播放速度"><option value=".5">0.5×</option><option value=".75">0.75×</option><option value="1" selected>1×</option></select><button id="loop" aria-pressed="false">片段循环</button><label class="volume">音量 <input id="volume" type="range" min="0" max="1" step=".01" value=".65"></label></div>
<div id="loopInputs" hidden><label>A <input id="loopA" type="number" min="0" step=".01" value="0"></label><label>B <input id="loopB" type="number" min=".5" step=".01" value="4"></label><button id="applyLoop">应用</button><span class="muted">按实际播放进度循环，至少 0.5 秒</span></div><div id="deviceError" hidden><span>声音设备不可用，请连接耳机或扬声器。</span><button id="retry">重试</button></div></main>
<div id="modal" hidden><section role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalhead"><b id="modalTitle"></b><button id="closeModal" aria-label="关闭窗口">×</button></div><div id="modalBody"></div><div id="modalActions"></div></section></div><script src="config.js"></script><script src="keyboard.js"></script><script src="v2.js"></script></body></html>
