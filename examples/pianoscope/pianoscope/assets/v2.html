<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self'; img-src 'self' file: data:; connect-src 'none'">
<title>PianoScope</title><link rel="stylesheet" href="v2.css"></head>
<body class="roll-view">
<button id="shade" aria-label="关闭侧栏" hidden></button>
<aside id="sidebar" aria-label="曲目与设置">
  <div class="brand"><b><span class="brand-icon">▥</span> Piano<span>Scope</span></b><button id="closeSidebar" aria-label="关闭侧栏">×</button></div>
  <div class="library-actions"><button id="folder" class="gold-outline">选择文件夹</button><button id="open">打开乐谱</button></div>
  <div class="sidebar-content">
    <section class="sidebar-section"><h2>示例曲目</h2><button data-demo="demo:first-light" class="demo">初光 <small>01</small></button><button data-demo="demo:harmonics" class="demo">回环与晨光 <small>02</small></button></section>
    <section class="sidebar-section"><h2 id="folderName">我的曲目</h2><input id="search" type="search" placeholder="搜索曲目" aria-label="搜索曲目"><div id="library"></div></section>
    <section class="sidebar-section"><h2>左右手</h2><div class="legend"><span class="left">● 左手</span><span class="right">● 右手</span><span class="unassigned">● 未分配</span></div><div id="handQuick" class="segmented hand-modes" role="radiogroup" aria-label="左右手试听" data-value="both"><button type="button" role="radio" value="both">双手</button><button type="button" role="radio" value="left">左手</button><button type="button" role="radio" value="right">右手</button></div><p id="handHint" class="hint">确认左右手后，可单独试听。</p><button id="hands" class="wide">左右手设置 <span>↗</span></button><button id="audition" class="wide">试听范围 <span>↗</span></button></section>
    <section class="sidebar-section"><h2>乐谱</h2><button id="export" class="wide">导出…</button><button id="diagnostics" class="wide">乐谱提示</button></section>
  </div><div class="sidebar-foot">A0 — C8 <span>88 键</span></div>
</aside>
<main>
  <div class="top"><button id="menu" aria-label="打开侧栏">☰</button><div class="song"><b id="title">PianoScope</b><small id="meta">看见音乐，认识琴键</small></div><div class="keytools"><div id="keyboardMode" class="segmented" role="radiogroup" aria-label="键盘范围" data-value="focused"><button id="full" type="button" role="radio" value="full">完整键盘</button><button id="focused" type="button" role="radio" value="focused">曲目键盘</button></div><label><input id="names" type="checkbox" checked>显示音名</label><button id="rollEffects" class="roll-effects" type="button" aria-pressed="true">触键光效</button><label class="lift-control">触键线上移 <input id="lift" type="range" min="0" max="60" value="0"><span id="liftText">0%</span></label></div></div>
  <div class="tools"><div class="segmented views" role="radiogroup" aria-label="乐谱视图" data-value="roll"><button id="sheetMode" type="button" role="radio" value="sheet">五线谱</button><button id="rollMode" type="button" role="radio" value="roll">下落音符</button></div><div class="score-tools" hidden><button id="follow" aria-pressed="true">自动跟随</button><button id="current">回到当前</button><div id="zoom" class="segmented" role="radiogroup" aria-label="谱面缩放" data-value="1"><button type="button" role="radio" value="1">100%</button><button type="button" role="radio" value="1.25">125%</button><button type="button" role="radio" value="1.5">150%</button></div><button id="keyboardToggle">显示键盘</button></div><span id="visitText" class="muted"></span><div id="occurrence" class="segmented" role="radiogroup" aria-label="跳转遍次" hidden></div></div>
  <div id="message" role="status" hidden></div><div id="loading" hidden><span id="loadLabel"></span><button id="cancelLoad">取消</button></div>
  <div class="music-scene">
  <section id="workspace"><div id="sheet" hidden tabindex="0" aria-label="五线谱"><div id="empty">打开乐谱后即可阅读、试听和慢练。<br><button id="emptyOpen">打开乐谱</button></div></div><div id="rollArea"><canvas id="roll"></canvas><div id="strike"><span id="strikeLabel">现在 · 按下</span></div></div></section>
  <div id="keyboard"><div id="keys" aria-label="钢琴键盘"></div></div>
  <div class="current-row"><span class="muted">当前音符</span><div id="currentNotes"></div><span id="picked" class="muted">中央 C · C4</span><span class="pedal-legend">■ 按住　□ 延音</span></div>
  </div>
  <section class="transport-panel" aria-label="播放控制">
    <div class="wave-head"><span>整曲声音概览</span><span><span id="position">00:00</span> / <span id="duration">00:00</span></span></div><canvas id="overview" tabindex="0" role="slider" aria-valuemin="0" aria-valuenow="0" aria-valuemax="0" aria-label="整曲声音概览，点击定位"></canvas>
    <input id="seek" hidden type="range" min="0" max="1" step=".001" value="0" aria-label="播放位置">
    <div class="transport"><div class="play-controls"><button id="play" class="primary icon" type="button" aria-label="播放" title="播放">▶</button><button id="stop" class="icon" type="button" aria-label="停止" title="停止">■</button></div><div id="rate" class="segmented" role="radiogroup" aria-label="播放速度" data-value="1"><button type="button" role="radio" value=".5">慢速 0.5×</button><button type="button" role="radio" value=".75">0.75×</button><button type="button" role="radio" value="1">正常 1×</button></div><button id="loop" aria-pressed="false">↻ 片段循环</button><button id="analysisToggle">▥ 查看频谱</button><label class="volume">音量 <input id="volume" type="range" min="0" max="1" step=".01" value=".65" aria-label="音量"><span id="volumeText">65%</span></label></div>
    <div id="loopInputs" hidden><label>A <input id="loopA" type="number" min="0" step=".01" value="0"> s</label><label>B <input id="loopB" type="number" min=".5" step=".01" value="4"> s</label><button id="applyLoop">应用</button><span id="loopVisits" class="muted"></span></div>
  </section>
  <div id="analysis" hidden><div><span>声音波形</span><canvas id="wave"></canvas></div><div><span>声音频谱</span><canvas id="spectrum"></canvas></div></div>
  <div id="deviceError" hidden><span>声音设备不可用，请连接耳机或扬声器。</span><button id="retry">重试</button></div>
</main>
<div id="modal" hidden><section role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalhead"><b id="modalTitle"></b><button id="closeModal" aria-label="关闭窗口">×</button></div><div id="modalBody"></div><div id="modalActions"></div></section></div>
<script src="config.js"></script><script src="keyboard.js"></script><script src="roll.js"></script><script src="v2.js"></script>
</body></html>
