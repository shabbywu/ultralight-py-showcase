[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "pianoscope"
version = "1.1.0"
description = "原生 MIDI 钢琴播放器"
requires-python = ">=3.10"
dependencies = ["ultralight-py==0.5.0", "numpy==2.2.6", "mido==1.3.3", "sounddevice==0.5.6", "verovio==5.6.0", "CairoSVG==2.8.2", "pypdf==6.12.2", "fonttools==4.63.0", "psutil==7.2.2", "pyobjc-framework-Cocoa==12.2.2; sys_platform == 'darwin'"]
[project.optional-dependencies]
test = ["pytest==9.1.1", "music21==9.9.1", "pymupdf==1.27.2.3"]
[tool.setuptools.package-data]
pianoscope = ["assets/*", "resources/demos/*", "resources/soundfonts/*", "resources/fonts/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "../../.tmp/pianoscope/pytest-cache"
[tool.setuptools.packages.find]
include = ["pianoscope*"]
