[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashen-reliquary-demo"
version = "0.1.0"
description = "Independent grid inventory in browser and ultralight-py"
requires-python = ">=3.10"
dependencies = ["ultralight-py==0.6.1"]

[tool.setuptools.packages.find]
include = ["reliquary*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "../../.tmp/ashen-reliquary/pytest-cache"
