[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashen-reliquary-demo"
version = "0.1.0"
description = "Independent grid inventory in browser and ultralight-py"
requires-python = ">=3.10"
dependencies = ["ultralight-py==0.6.1"]

[tool.setuptools.packages.find]
include = ["reliquary*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "../../.tmp/ashen-reliquary/pytest-cache"

[tool.setuptools.package-data]
reliquary = ["catalog.json"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "ANN", "D1"]

[project.optional-dependencies]
dev = ["ruff", "mypy"]
media = ["Pillow"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["reliquary", "tests", "tools", "run.py"]
cache_dir = "../../.tmp/ashen-reliquary/mypy-cache"

[[tool.mypy.overrides]]
module = ["ultralight_py", "ultralight_py.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["PIL", "PIL.*"]
ignore_missing_imports = true
